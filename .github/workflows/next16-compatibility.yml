name: Next 16 compatibility check

on:
  push:
    branches:
      - chore/next-16-safe-migration
  pull_request:
    branches:
      - chore/next-16-safe-migration

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply official Next 16 async API codemod
        if: "!contains(github.event.head_commit.message, '[next16-codemod]')"
        run: npx @next/codemod@canary next-async-request-api .
      - name: Commit codemod changes
        if: "!contains(github.event.head_commit.message, '[next16-codemod]')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: apply Next 16 async API codemod [next16-codemod]"
          git push
      - run: npx tsc --noEmit
      - run: npm run build
