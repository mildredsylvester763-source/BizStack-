name: BizStack verification

on:
  push:
    branches:
      - main
      - "feat/**"
      - "migration/**"
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-placeholder
      BIZSTACK_ENCRYPTION_KEY: 0
      CRON_SECRET: build-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
